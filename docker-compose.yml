services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: rpm
      POSTGRES_PASSWORD: rpm
      POSTGRES_DB: rpm_stock
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rpm -d rpm_stock']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
